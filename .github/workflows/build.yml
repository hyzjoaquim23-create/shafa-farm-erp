
name: Build website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Package website
        run: cd dist && zip -r ../website.zip .

      - name: Save built website
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: website.zip
          retention-days: 7
